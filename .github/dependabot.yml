# Monthly grouped bumps — one PR per ecosystem per cycle, not a flood.
# Cargo is tracked too: AGENTS.md's "3 runtime deps" cap is about
# *adding* deps, not pinning the existing ones to stale versions.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
