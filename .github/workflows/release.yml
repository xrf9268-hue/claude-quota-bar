name: Release

# release-plz drives everything. On each push to main it maintains a Release PR
# (version bump + CHANGELOG). When that PR merges, release-plz cuts the tag and
# GitHub Release; the build / asset / npm jobs below run in the SAME workflow
# run, gated on `releases_created`. Keeping them in one run means the default
# GITHUB_TOKEN is enough — we never rely on a token-created tag to trigger a
# separate workflow (which GITHUB_TOKEN cannot do), so no PAT or App is needed.

on:
  push:
    branches: [main]

# Least privilege by default; jobs opt into more where needed.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: claude-quota-bar

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    # Don't run the release machinery on forks.
    if: github.repository == 'xrf9268-hue/claude-quota-bar'
    permissions:
      contents: write # create the tag, the release, and push the Release PR branch
      pull-requests: write # open / update the Release PR
      id-token: write # crates.io OIDC Trusted Publishing (release-plz exchanges it itself)
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: ${{ matrix.target }}
    needs: release-plz
    if: needs.release-plz.outputs.releases_created == 'true'
    runs-on: ${{ matrix.os }}
    # Surface the matrix target as a shell env var so run-scripts never
    # interpolate ${{ }} directly into bash (injection-safe + shellcheck-clean).
    env:
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            ext: tar.gz
            use_zigbuild: false
          # Cross-compile Intel mac binary from Apple Silicon runner.
          # macos-13 Intel runners have effectively been retired (queue times
          # >1h). macos-14's Apple LLVM toolchain handles both targets natively
          # — just add the x86_64-apple-darwin rust target via rustup.
          - target: x86_64-apple-darwin
            os: macos-14
            ext: tar.gz
            use_zigbuild: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            ext: tar.gz
            use_zigbuild: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            ext: tar.gz
            use_zigbuild: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            ext: tar.gz
            use_zigbuild: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            ext: tar.gz
            use_zigbuild: true
          - target: x86_64-pc-windows-gnu
            os: ubuntu-22.04
            ext: zip
            use_zigbuild: false
            mingw: true

    steps:
      # Build the exact commit release-plz tagged, not the workflow's trigger
      # SHA — they can differ if other commits land on main around the merge.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ fromJSON(needs.release-plz.outputs.releases)[0].tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install MinGW (Windows cross)
        if: matrix.mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install cargo-zigbuild (cross-compile via Zig)
        if: matrix.use_zigbuild
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.13.0"

      - name: Install cargo-zigbuild binary
        if: matrix.use_zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build (zigbuild)
        if: matrix.use_zigbuild
        run: cargo zigbuild --release --target "$TARGET"

      - name: Build (native)
        if: ${{ !matrix.use_zigbuild }}
        run: cargo build --release --target "$TARGET"

      - name: Package (Unix)
        if: matrix.ext == 'tar.gz'
        run: |
          set -euo pipefail
          mkdir -p dist
          bin="target/$TARGET/release/$BINARY_NAME"
          # Strip symbols where the target toolchain supports it.
          if command -v llvm-strip >/dev/null 2>&1 && [[ "$TARGET" == *darwin* ]]; then
            llvm-strip "$bin" || true
          elif [[ "$TARGET" == *linux* ]] && ! [[ "$TARGET" == aarch64-* ]]; then
            strip "$bin" || true
          fi
          name="$BINARY_NAME-$TARGET"
          tar -czf "dist/${name}.tar.gz" -C "$(dirname "$bin")" "$(basename "$bin")"
          ls -lh dist/

      - name: Package (Windows)
        if: matrix.ext == 'zip'
        run: |
          set -euo pipefail
          mkdir -p dist
          bin="target/$TARGET/release/$BINARY_NAME.exe"
          name="$BINARY_NAME-$TARGET"
          (cd "$(dirname "$bin")" && zip "$GITHUB_WORKSPACE/dist/${name}.zip" "$(basename "$bin")")
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release-assets:
    name: Attach binaries to release
    needs: [release-plz, build]
    if: needs.release-plz.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the release release-plz created
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ fromJSON(needs.release-plz.outputs.releases)[0].tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} release-assets/ \;
          ls -lh release-assets/

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ fromJSON(needs.release-plz.outputs.releases)[0].tag }}
        run: gh release upload "$TAG" release-assets/* --clobber

  publish-npm:
    name: Publish to NPM
    needs: [release-plz, build]
    if: needs.release-plz.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    # OIDC: GitHub Actions mints a short-lived token that npm exchanges for
    # publish access via Trusted Publishing — no long-lived NPM_TOKEN stored
    # in repo secrets.
    permissions:
      contents: read
      id-token: write
    steps:
      # Publish the npm packages from the released tag so the version and
      # bundled binaries match the GitHub Release exactly.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ fromJSON(needs.release-plz.outputs.releases)[0].tag }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # Node 24 ships with npm 11+; OIDC trusted publishing needs ≥ 11.5.
          # We avoid `npm install -g npm@latest` because in-place npm upgrades
          # sometimes break transitive deps (e.g. `promise-retry` not found).
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: Publish platform + umbrella packages
        run: node npm/scripts/prepare-packages.js
